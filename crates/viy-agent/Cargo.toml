[package]
name = "viy-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "viy's chat engine: streaming, sessions, the tool loop and compaction"
license-file.workspace = true
repository.workspace = true

[lib]
name = "viy_agent"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
# The oracle tests need python3 and the rpctl checkout; off in the pre-commit hook.
oracle = ["viy-testkit/oracle"]

[dependencies]
futures-util = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
libc = { workspace = true }
viy-config = { workspace = true }
viy-exec = { workspace = true }
viy-http = { workspace = true }
viy-protocol = { workspace = true }
viy-time = { workspace = true }
viy-tools = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
pretty_assertions = { workspace = true }
viy-tools = { workspace = true, features = ["test-support"] }
viy-testkit = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
