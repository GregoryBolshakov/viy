[package]
name = "viy-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "viy_agent"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
# The oracle tests need python3 and the rpctl checkout; off in the pre-commit hook.
oracle = ["viy-testkit/oracle"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
viy-config = { workspace = true }
viy-http = { workspace = true }
viy-protocol = { workspace = true }
viy-time = { workspace = true }
viy-tools = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
viy-testkit = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
