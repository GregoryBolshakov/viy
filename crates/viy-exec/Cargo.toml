[package]
name = "viy-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The process seam viy starts commands through"
license-file.workspace = true
repository.workspace = true

[lib]
name = "viy_exec"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
libc = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
