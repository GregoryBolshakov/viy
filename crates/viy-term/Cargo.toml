[package]
name = "viy-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "viy_term"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
crossterm = { workspace = true, features = ["bracketed-paste", "event-stream"] }
futures-core = { workspace = true }
ratatui = { workspace = true }
signal-hook = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
viy-protocol = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
libc = { workspace = true }
pretty_assertions = { workspace = true }
# The backend's writer, for the vt100 test backend (as Codex's tui).
ratatui = { workspace = true, features = ["unstable-backend-writer"] }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "test-util", "time"] }
viy-testkit = { workspace = true }
vt100 = { workspace = true }
