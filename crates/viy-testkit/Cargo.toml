[package]
name = "viy-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "viy_testkit"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
# The oracle needs python3 and the rpctl checkout; off in the pre-commit hook.
oracle = []

[dependencies]
libc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
viy-exec = { workspace = true }
viy-http = { workspace = true }
viy-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
