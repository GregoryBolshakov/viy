[package]
name = "viy-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "viy's safeguards: approval, the bubblewrap sandbox, the egress proxy and untrusted text"
license-file.workspace = true
repository.workspace = true

[lib]
name = "viy_tools"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
# The oracle tests need python3 and the rpctl snapshot; off in the pre-commit hook.
oracle = ["viy-testkit/oracle"]
# Proxy::record_reached and record_blocked, for viy-agent's tests.
test-support = []

[dependencies]
flate2 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
icu_normalizer = { workspace = true }
idna = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde_json = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true }
viy-config = { workspace = true }
viy-exec = { workspace = true }
viy-http = { workspace = true }
viy-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
viy-testkit = { workspace = true }
