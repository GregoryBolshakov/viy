[package]
name = "viy-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "viy_tools"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
# The oracle tests need python3 and the rpctl snapshot; off in the pre-commit hook.
oracle = ["viy-testkit/oracle"]

[dependencies]
libc = { workspace = true }
serde_json = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
viy-exec = { workspace = true }
viy-http = { workspace = true }
viy-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
viy-testkit = { workspace = true }
