[package]
name = "viy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "viy"
path = "src/main.rs"

[lib]
name = "viy_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
viy-agent = { workspace = true }
viy-config = { workspace = true }
viy-exec = { workspace = true }
viy-http = { workspace = true }
viy-pod = { workspace = true }
viy-protocol = { workspace = true }
viy-term = { workspace = true }
viy-time = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
pretty_assertions = { workspace = true }
viy-testkit = { workspace = true }
vt100 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "test-util", "time"] }
